<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bestscripts Stream Banner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px;
    height: 120px;
    overflow: hidden;
    background: transparent;
    font-family: 'Rajdhani', sans-serif;
    position: relative;
  }

  .banner {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    background: linear-gradient(180deg,
      transparent 0%,
      rgba(8, 2, 14, 0.78) 18%,
      rgba(15, 4, 25, 0.95) 45%,
      rgba(11, 2, 19, 0.98) 100%
    );
  }

  .plasma-line-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg,
      transparent 0%,
      #4C1D95 12%,
      #7C3AED 28%,
      #B026FF 50%,
      #C084FC 70%,
      #6B21A8 88%,
      transparent 100%
    );
    animation: plasma-line 3.2s ease-in-out infinite alternate;
  }
  .plasma-line-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(107, 33, 168, 0.4) 20%,
      rgba(176, 38, 255, 0.45) 50%,
      rgba(107, 33, 168, 0.4) 80%,
      transparent 100%
    );
  }
  @keyframes plasma-line {
    0%   { opacity: 0.75; filter: blur(0px) drop-shadow(0 0 6px rgba(176, 38, 255, 0.7)); }
    50%  { opacity: 1;   filter: blur(1px) drop-shadow(0 0 16px rgba(192, 132, 252, 0.95)); }
    100% { opacity: 0.75; filter: blur(0px) drop-shadow(0 0 6px rgba(176, 38, 255, 0.7)); }
  }

  /* ── Brand Section ── */
  .brand-section {
    display: flex;
    align-items: center;
    padding: 0 32px;
    gap: 16px;
    flex-shrink: 0;
  }

  .brand-logo-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 82px;
    height: 82px;
    flex-shrink: 0;
  }
  .brand-logo-glow {
    position: absolute;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(176, 38, 255, 0.45) 0%, rgba(126, 34, 206, 0.15) 60%, transparent 80%);
    filter: blur(10px);
    pointer-events: none;
    animation: glow-pulse 3s ease-in-out infinite alternate;
  }
  @keyframes glow-pulse {
    0% { transform: scale(0.95); opacity: 0.6; }
    100% { transform: scale(1.15); opacity: 1; }
  }

  .brand-logo {
    position: relative;
    height: 80px;
    width: auto;
    max-width: 82px;
    object-fit: contain;
    filter: drop-shadow(0 0 10px rgba(176, 38, 255, 0.75)) drop-shadow(0 0 22px rgba(126, 34, 206, 0.5));
    animation: logo-float 4s ease-in-out infinite alternate;
    user-select: none;
  }
  @keyframes logo-float {
    0%   { transform: translateY(0px) rotate(0deg); }
    50%  { transform: translateY(-2px) rotate(0.6deg); }
    100% { transform: translateY(0px) rotate(0deg); }
  }

  .brand-text {
    display: flex;
    align-items: baseline;
    font-family: 'Teko', sans-serif;
    font-weight: 700;
    font-size: 46px;
    letter-spacing: 5px;
    text-transform: uppercase;
    white-space: nowrap;
    line-height: 1;
  }
  .brand-name-best {
    color: #F5EEF8;
    text-shadow: 0 0 16px rgba(192, 132, 252, 0.6), 0 0 28px rgba(126, 34, 206, 0.4);
    letter-spacing: 6px;
  }
  .brand-name-scripts {
    background: linear-gradient(135deg, #F3E8FF 0%, #C084FC 40%, #B026FF 75%, #7C3AED 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 14px rgba(176, 38, 255, 0.9));
    letter-spacing: 6px;
    margin-left: 2px;
    animation: scripts-pulse 3s ease-in-out infinite alternate;
  }
  @keyframes scripts-pulse {
    0% { filter: drop-shadow(0 0 12px rgba(176, 38, 255, 0.8)); }
    100% { filter: drop-shadow(0 0 22px rgba(192, 132, 252, 1)); }
  }

  .brand-divider {
    width: 2px;
    height: 56px;
    margin: 0 24px;
    background: linear-gradient(180deg, transparent 0%, #7C3AED 25%, #C084FC 50%, #7C3AED 75%, transparent 100%);
    flex-shrink: 0;
    box-shadow: 0 0 10px rgba(176, 38, 255, 0.6);
  }

  /* ── Live Badge ── */
  .live-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    padding: 6px 14px;
    background: rgba(126, 34, 206, 0.12);
    border: 1px solid rgba(192, 132, 252, 0.25);
    border-radius: 20px;
    box-shadow: 0 0 14px rgba(176, 38, 255, 0.2);
  }
  .live-dot {
    width: 10px; height: 10px;
    background: #B026FF;
    border-radius: 50%;
    box-shadow: 0 0 10px #B026FF, 0 0 20px rgba(176, 38, 255, 0.8);
    animation: dot-blink 1.8s ease-in-out infinite;
  }
  @keyframes dot-blink {
    0%, 100% { opacity: 1; box-shadow: 0 0 10px #B026FF, 0 0 20px rgba(176, 38, 255, 0.8); }
    50%      { opacity: 0.35; box-shadow: 0 0 4px #7C3AED; }
  }
  .live-text {
    font-family: 'Teko', sans-serif;
    font-weight: 600;
    font-size: 24px;
    color: #E9D5FF;
    letter-spacing: 4px;
    text-shadow: 0 0 10px rgba(176, 38, 255, 0.7);
    line-height: 1;
  }

  /* ── Rotating Social Carousel ── */
  .social-carousel {
    margin-left: auto;
    padding-right: 42px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-shrink: 0;
    min-width: 480px;
    justify-content: flex-end;
  }

  .social-stage {
    position: relative;
    width: 380px;
    height: 52px;
    overflow: hidden;
  }

  .social-slide {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
  }
  .social-slide.active {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .social-slide.exit-up {
    opacity: 0;
    transform: translateY(-30px);
  }

  .social-icon-box {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(126, 34, 206, 0.35) 0%, rgba(88, 28, 135, 0.15) 100%);
    border: 1px solid rgba(192, 132, 252, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 12px rgba(176, 38, 255, 0.25);
    flex-shrink: 0;
  }
  .social-icon {
    width: 22px; height: 22px;
    fill: #C084FC;
    filter: drop-shadow(0 0 6px rgba(176, 38, 255, 0.8));
    flex-shrink: 0;
  }

  .social-text-wrap {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .social-platform-label {
    font-family: 'Teko', sans-serif;
    font-weight: 500;
    font-size: 14px;
    color: rgba(192, 132, 252, 0.9);
    letter-spacing: 4px;
    text-transform: uppercase;
    line-height: 1;
  }
  .social-handle {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: #FAF5FF;
    letter-spacing: 0.5px;
    white-space: nowrap;
    line-height: 1.15;
    text-shadow: 0 0 10px rgba(176, 38, 255, 0.4);
  }

  .interstitial-text {
    font-family: 'Teko', sans-serif;
    font-weight: 700;
    font-size: 36px;
    letter-spacing: 9px;
    background: linear-gradient(135deg, #FFFFFF 10%, #E9D5FF 35%, #C084FC 70%, #B026FF 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 14px rgba(176, 38, 255, 0.8)) drop-shadow(0 0 32px rgba(126, 34, 206, 0.5));
    width: 100%;
    text-align: center;
    line-height: 1;
  }

  .carousel-dots {
    display: flex;
    gap: 7px;
    flex-shrink: 0;
  }
  .carousel-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(168, 85, 247, 0.25);
    transition: all 0.4s ease;
  }
  .carousel-dot.active {
    background: #C084FC;
    box-shadow: 0 0 8px rgba(192, 132, 252, 0.9), 0 0 14px rgba(176, 38, 255, 0.7);
    transform: scale(1.35);
  }

  .carousel-progress {
    position: absolute;
    bottom: 0; left: 0;
    height: 2px;
    background: linear-gradient(90deg, #6B21A8, #B026FF, #E9D5FF);
    box-shadow: 0 0 8px rgba(176, 38, 255, 0.6);
    border-radius: 1px;
    width: 0%;
    animation: progress-fill 3.5s linear infinite;
  }
  @keyframes progress-fill {
    0% { width: 0%; }
    100% { width: 100%; }
  }

  /* Corner accents */
  .corner-accent {
    position: absolute;
    z-index: 3;
    pointer-events: none;
  }
  .corner-accent.tl { top: 0; left: 0; }
  .corner-accent.tr { top: 0; right: 0; transform: scaleX(-1); }
  .corner-accent.bl { bottom: 0; left: 0; transform: scaleY(-1); }
  .corner-accent.br { bottom: 0; right: 0; transform: scale(-1); }

  #stardust {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
  }
</style>
</head>

<script>
(function() {
  var slides = document.querySelectorAll('.social-slide');
  var dots = document.querySelectorAll('.carousel-dot');
  var progressBar = document.querySelector('.carousel-progress');
  var current = 0;
  var total = slides.length;
  var socialDotIndex = 0;
  var SOCIAL_HOLD = 3500;
  var BRAND_HOLD = 1300;

  function isInterstitial(i) {
    return i % 2 === 1;
  }

  function advance() {
    var prev = current;
    slides[prev].classList.remove('active');
    slides[prev].classList.add('exit-up');
    setTimeout(function() { slides[prev].classList.remove('exit-up'); }, 500);

    current = (current + 1) % total;
    slides[current].classList.add('active');

    if (!isInterstitial(current)) {
      socialDotIndex = Math.floor(current / 2);
      dots.forEach(function(d) { d.classList.remove('active'); });
      if (dots[socialDotIndex]) {
        dots[socialDotIndex].classList.add('active');
      }
    }

    progressBar.style.animation = 'none';
    progressBar.offsetHeight; // trigger reflow
    var hold = isInterstitial(current) ? BRAND_HOLD : SOCIAL_HOLD;
    progressBar.style.animation = 'progress-fill ' + (hold / 1000) + 's linear';

    if (isInterstitial(current)) {
      progressBar.style.background = 'linear-gradient(90deg, #A855F7, #C084FC, #FFFFFF)';
    } else {
      progressBar.style.background = 'linear-gradient(90deg, #6B21A8, #B026FF, #E9D5FF)';
    }

    setTimeout(advance, hold);
  }

  progressBar.style.animation = 'progress-fill ' + (SOCIAL_HOLD / 1000) + 's linear';
  setTimeout(advance, SOCIAL_HOLD);

  // Stardust & Sparkle Particle System
  var canvas = document.getElementById('stardust');
  var ctx = canvas.getContext('2d');
  canvas.width = 1920;
  canvas.height = 120;
  var particles = [];
  var COLORS = ['#B026FF', '#C084FC', '#A855F7', '#E9D5FF', '#D8B4FE', '#FFFFFF'];

  function spawnParticle() {
    var x = Math.random() * 1920;
    var fromTop = Math.random() < 0.5;
    var isStar = Math.random() < 0.35; // 35% chance to be 4-point star sparkle
    particles.push({
      x: x,
      y: fromTop ? 3 + Math.random() * 10 : 108 + Math.random() * 10,
      vx: (Math.random() - 0.5) * 0.7,
      vy: fromTop ? (Math.random() * 0.75 + 0.2) : -(Math.random() * 0.75 + 0.2),
      size: Math.random() * 2.2 + 0.8,
      life: 1,
      decay: Math.random() * 0.012 + 0.006,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      isStar: isStar,
      rotation: Math.random() * Math.PI
    });
  }

  function drawSparkleStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
    var rot = Math.PI / 2 * 3;
    var step = Math.PI / spikes;
    ctx.beginPath();
    ctx.moveTo(cx, cy - outerRadius);
    for (var i = 0; i < spikes; i++) {
      var x = cx + Math.cos(rot) * outerRadius;
      var y = cy + Math.sin(rot) * outerRadius;
      ctx.lineTo(x, y);
      rot += step;
      x = cx + Math.cos(rot) * innerRadius;
      y = cy + Math.sin(rot) * innerRadius;
      ctx.lineTo(x, y);
      rot += step;
    }
    ctx.lineTo(cx, cy - outerRadius);
    ctx.closePath();
  }

  function animate() {
    ctx.clearRect(0, 0, 1920, 120);
    if (Math.random() < 0.45) spawnParticle();
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx + Math.sin(Date.now() * 0.003 + i) * 0.18;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = p.life * 0.75;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;

      if (p.isStar) {
        var starR = p.size * 2.2 * p.life;
        drawSparkleStar(ctx, p.x, p.y, 4, starR, starR * 0.3);
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    requestAnimationFrame(animate);
  }
  animate();
})();
</script>
</body>
